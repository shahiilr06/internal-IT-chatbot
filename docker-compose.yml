version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./rag:/app/rag
      - hf_cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  hf_cache:
