<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexira IT Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #565869;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #acacbe;
        }
        .prose {
            line-height: 1.6;
            color: #ececf1;
        }
        .prose p {
            margin-bottom: 1rem;
        }
        .prose h1, .prose h2, .prose h3, .prose h4 {
            color: #fff;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .prose h3 {
            font-size: 1.25em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.3rem;
        }
        .prose ul, .prose ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .prose ul {
            list-style-type: disc;
        }
        .prose ol {
            list-style-type: decimal;
        }
        .prose li {
            margin-bottom: 0.25rem;
        }
        .prose strong {
            color: #fff;
            font-weight: 600;
        }
        .prose a {
            color: #10a37f;
            text-decoration: underline;
        }
        .prose pre {
            background-color: #000;
            color: #fff;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
        }
        .prose code {
            background-color: rgba(255,255,255,0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.9em;
        }
        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        .prose th, .prose td {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5rem;
            text-align: left;
        }
        .prose th {
            background-color: rgba(255,255,255,0.05);
        }
        .typing-indicator span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background-color: #ececf1;
            border-radius: 50%;
            margin-right: 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-[#343541] text-white h-screen flex overflow-hidden font-sans">

    <!-- Sidebar -->
    <aside class="w-[260px] bg-[#202123] flex-shrink-0 hidden md:flex flex-col p-2">
        <button id="new-chat-btn" class="flex items-center gap-3 px-3 py-3 w-full rounded-md border border-white/20 hover:bg-white/5 transition-colors cursor-pointer text-sm mb-4">
            <i class="fa-solid fa-plus text-sm"></i>
            New chat
        </button>
        <div class="flex-1 overflow-y-auto text-sm text-gray-300">
            <div class="px-3 pb-2 text-xs font-semibold text-gray-500 mt-4">Today</div>
            <div class="flex items-center gap-3 px-3 py-3 w-full rounded-md hover:bg-[#2A2B32] cursor-pointer group">
                <i class="fa-regular fa-message"></i>
                <div class="flex-1 truncate">IT Documentation Query</div>
            </div>
        </div>
        <div class="border-t border-white/20 pt-2 mt-2">
            <div class="flex items-center gap-3 px-3 py-3 w-full rounded-md hover:bg-white/5 cursor-pointer text-sm transition-colors">
                <div class="w-7 h-7 bg-purple-600 rounded-sm flex items-center justify-center text-xs font-bold">N</div>
                <div class="truncate">Nexira Employee</div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative w-full h-full">
        <!-- Mobile Header -->
        <header class="md:hidden flex items-center justify-between p-3 border-b border-white/20 bg-[#343541] text-gray-200">
            <button class="p-2 rounded-md hover:bg-white/5"><i class="fa-solid fa-bars"></i></button>
            <div class="font-medium">New chat</div>
            <button class="p-2 rounded-md hover:bg-white/5"><i class="fa-solid fa-plus"></i></button>
        </header>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto pb-32">
            <!-- Initial Welcome Message -->
            <div class="h-full flex flex-col items-center justify-center text-center px-4" id="welcome-screen">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-6 shadow-sm">
                    <i class="fa-solid fa-robot text-black text-3xl"></i>
                </div>
                <h1 class="text-3xl font-semibold mb-8">How can I help you today?</h1>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl w-full">
                    <div class="p-4 border border-white/20 rounded-xl text-left hover:bg-white/5 cursor-pointer text-sm text-gray-300 flex flex-col gap-1 transition-colors">
                        <span class="font-semibold text-gray-200">Network Access</span>
                        <span class="opacity-70">How do I connect to the Vanguard VPN?</span>
                    </div>
                    <div class="p-4 border border-white/20 rounded-xl text-left hover:bg-white/5 cursor-pointer text-sm text-gray-300 flex flex-col gap-1 transition-colors">
                        <span class="font-semibold text-gray-200">Software Installation</span>
                        <span class="opacity-70">What is the policy for installing new tools?</span>
                    </div>
                </div>
            </div>
            
            <!-- Messages will be injected here -->
            <div id="messages-wrapper" class="flex flex-col"></div>
        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[#343541] via-[#343541] to-transparent pt-6 pb-6 px-4">
            <div class="max-w-3xl mx-auto w-full relative">
                <form id="chat-form" class="relative flex items-center flex-col w-full bg-[#40414F] rounded-xl shadow-[0_0_15px_rgba(0,0,0,0.1)] border border-white/10">
                    <div class="w-full flex">
                        <textarea id="message-input" rows="1" class="w-full bg-transparent text-white border-0 py-4 pl-4 pr-12 focus:ring-0 resize-none max-h-48 overflow-y-auto m-0 outline-none" placeholder="Ask about internal IT documentation..." style="min-height: 56px;"></textarea>
                        <button type="submit" id="send-button" class="absolute bottom-3 right-3 p-1 rounded-md text-gray-400 bg-transparent disabled:opacity-40 transition-colors hover:bg-gray-700">
                            <span class="bg-white text-black p-1.5 rounded-md flex items-center justify-center">
                                <i class="fa-solid fa-arrow-up text-sm"></i>
                            </span>
                        </button>
                    </div>
                </form>
                <div class="text-xs text-center text-gray-400 mt-2 px-4">
                    IT Assistant can make mistakes. Check internal documents for critical info.
                </div>
            </div>
        </div>
    </main>

    <script>
        marked.setOptions({
            gfm: true,
            breaks: true
        });

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const messagesWrapper = document.getElementById('messages-wrapper');
        const welcomeScreen = document.getElementById('welcome-screen');
        const sendButton = document.getElementById('send-button');
        const newChatBtn = document.getElementById('new-chat-btn');

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = '56px';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() === '') {
                sendButton.disabled = true;
            } else {
                sendButton.disabled = false;
            }
        });

        // Handle Enter key (Shift+Enter for newline)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function createMessageElement(content, isUser) {
            const wrapper = document.createElement('div');
            wrapper.className = `w-full ${isUser ? 'bg-[#343541]' : 'bg-[#444654]'} border-b border-black/10`;
            
            const inner = document.createElement('div');
            inner.className = 'max-w-3xl mx-auto flex p-6 gap-6 text-base';
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-sm flex items-center justify-center flex-shrink-0 ${isUser ? 'bg-purple-600' : 'bg-[#19C37D]'}`;
            if (isUser) {
                avatar.innerHTML = '<span class="text-white text-sm font-bold">N</span>';
            } else {
                avatar.innerHTML = '<i class="fa-solid fa-robot text-white text-sm"></i>';
            }

            const textContainer = document.createElement('div');
            textContainer.className = 'flex-1 prose text-gray-100 max-w-none';
            
            if (!isUser && content === null) {
                // Typing indicator
                textContainer.innerHTML = '<div class="typing-indicator mt-2"><span></span><span></span><span></span></div>';
                textContainer.id = 'typing-indicator';
            } else {
                // Parse markdown if it's the bot, plain text if user
                textContainer.innerHTML = isUser ? content.replace(/\n/g, '<br>') : marked.parse(content);
            }

            inner.appendChild(avatar);
            inner.appendChild(textContainer);
            wrapper.appendChild(inner);
            return wrapper;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = messageInput.value.trim();
            if (!query) return;

            // Hide welcome screen
            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            // Reset input
            messageInput.value = '';
            messageInput.style.height = '56px';
            sendButton.disabled = true;

            // Add user message
            messagesWrapper.appendChild(createMessageElement(query, true));
            scrollToBottom();

            // Add typing indicator
            const typingElem = createMessageElement(null, false);
            messagesWrapper.appendChild(typingElem);
            scrollToBottom();

            try {
                // Call FastAPI backend
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                
                // Remove typing indicator
                typingElem.remove();

                if (response.ok) {
                    messagesWrapper.appendChild(createMessageElement(data.answer, false));
                } else {
                    messagesWrapper.appendChild(createMessageElement('Sorry, an error occurred: ' + (data.detail || 'Server error'), false));
                }
            } catch (error) {
                // Remove typing indicator
                typingElem.remove();
                messagesWrapper.appendChild(createMessageElement('Network error: Unable to reach the API backend. Make sure the Python server is running on port 8000.', false));
            }
            scrollToBottom();
        });

        newChatBtn.addEventListener('click', () => {
            messagesWrapper.innerHTML = '';
            welcomeScreen.style.display = 'flex';
        });

    </script>
</body>
</html>
